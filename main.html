if(P.deep&&mv){u.a[0].rotation.x=Math.sin(now*6)*1.1-1.3;u.a[1].rotation.x=-Math.sin(now*6)*1.1-1.3}else{u.a[0].rotation.x=-sw*.7;if(P.at<=0)u.a[1].rotation.x=sw*.7}
if(P.at>0){P.at-=dt;const pr=1-P.at/.35;u.a[1].rotation.x=-Math.sin(pr*Math.PI)*2.4-.3;if(!P.hit&&pr>.5){P.hit=1;strike()}}else if(atk&&eq!=='angel')begAtk();
pl.position.set(P.x,P.deep?-1.05+Math.sin(now*2)*.05:P.y+(inW?-.3:0),P.z);pl.rotation.y=P.ra}
function vgF(){const v=$('vg');v.style.opacity=1;setTimeout(()=>v.style.opacity=0,220)}
function updW(dt,night){
  const byK={};for(const a of fauna)if(!a.dead){(byK[a.k]=byK[a.k]||[]).push(a)}
  for(const a of fauna){
    const f=FK[a.k];
    if(a.dead){
      if(now>a.rt){a.dead=0;a.hp=f.hp;a.m.visible=true;[a.x,a.z]=sPos(a.k);
        a.st=0;a.busy=0;a.cryed=0;a.hX=0;a.gal=0;a.arcT=0;}
      continue;
    }
    const dp=hyp(P.x-a.x,P.z-a.z);
    a.t-=dt;a.agr=Math.max(0,a.agr-dt);a.st=Math.max(0,(a.st||0)-dt);a.hX=a.hX||0;
    const hunting=f.hunt&&(a.agr>0||dp<(night?f.an:f.ad));
    const fleeing=!f.hunt&&(dp<f.flee||a.agr>0);
    let sp=0;a.gal=0;

    if(hunting){
      a.a=Math.atan2(P.x-a.x,P.z-a.z);
      sp=dp>1.6?f.run:0;
      a.at-=dt;
      if(dp<1.9&&a.at<=0){a.at=f.cd;P.hp-=f.dmg*DIFM[CFG.dif];vgF();
        say(f.label+' greift an!');cry(a,'atk');}
      a.st=2;a.busy=0;
    } else if(fleeing){
      const baseAng=Math.atan2(a.x-P.x,a.z-P.z);
      a.arcT=(a.arcT||0)+dt*2.4;
      const arc=f.gallop?Math.sin(a.arcT+(a.phase||0))*0.75:0;
      a.a=baseAng+arc;
      sp=f.gallop?f.run*1.15:f.run;
      a.gal=f.gallop?1:0;
      a.st=2.5;
      if(!a.cryed){a.cryed=1;cry(a,'alert');alarmNear(a);}
    } else {
      a.cryed=0;
      if(!a.busy&&a.st<=0){
        const r=R();
        const restTime=(f.diurnal&&night)||(f.nocturnal&&!night);
        if(restTime&&r<.55){a.busy='rest';a.bT=3+R()*5;}
        else if(f.graze&&r<(f.diurnal&&!night?.55:.2)){a.busy='graze';a.bT=2+R()*4;}
        else if(f.herd&&r<.4){
          const h=herdCenter(a);
          if(h&&hyp(h[0]-a.x,h[1]-a.z)>f.herdR*.5){
            a.a=Math.atan2(h[0]-a.x,h[1]-a.z);a.busy='walk';a.bT=2+R()*3;
          }
        }
      }
      if(a.busy==='walk'){sp=f.walk;a.bT-=dt;if(a.bT<=0)a.busy=0;}
      else if(a.busy==='graze'){a.bT-=dt;if(a.bT<=0)a.busy=0;}
      else if(a.busy==='rest'){a.bT-=dt;if(a.bT<=0)a.busy=0;}
      else{
        if(a.t<=0){a.a=R()*6.3;a.t=2+R()*4;a.go=R()<.55;}
        sp=a.go?f.walk:0;
      }
    }

    if(f.herd){const hb=byK[a.k];
      for(const b of hb){if(b===a)continue;
        const dx=b.x-a.x,dz=b.z-a.z,d=hyp(dx,dz);
        if(d>0&&d<1.1){const k=(1.1-d)*3*dt;a.x-=dx/d*k;a.z-=dz/d*k;}}}

    if(sp){
      const ox=a.x,oz=a.z;a.y=gY(a.x,a.z);
      step(a,Math.sin(a.a)*sp*dt,Math.cos(a.a)*sp*dt,.5,0);
      if(H(a.x,a.z)<.3||(a.x===ox&&a.z===oz)){a.x=ox;a.z=oz;a.a+=2;a.t=0;a.busy=0;}
    }
    a.y=Math.max(gY(a.x,a.z),0);
    a.ph+=dt*sp*(a.gal?4.5:3.2);
    const s=sp?Math.sin(a.ph)*(a.gal?1.0:0.6):0,L=a.m.u.legs;
    L.forEach((l,i)=>l.rotation.x=i%3?-s:s);

    const u=a.m.u;
    const tgt=(a.busy==='graze'?1:a.busy==='rest'?-.35:
      (sp?Math.sin(a.ph*2)*.06:Math.sin(now*1.2+a.x*.3)*.04));
    a.hX+=(tgt-a.hX)*Math.min(1,dt*6);
    u.hd.rotation.x=a.hX;

    const bob=sp?(a.gal?Math.abs(Math.sin(a.ph))*.13:Math.abs(Math.sin(a.ph))*.05):0;
    a.m.position.set(a.x,a.y+bob,a.z);
    a.m.rotation.y+=Math.atan2(Math.sin(a.a-a.m.rotation.y),Math.cos(a.a-a.m.rotation.y))*Math.min(1,dt*6);
    const targetBank=a.gal?Math.sin(a.arcT+(a.phase||0))*0.18:0;
    a.m.rotation.z+=(targetBank-(a.m.rotation.z||0))*Math.min(1,dt*6);
  }
  for(const a of fauna){if(a.dead)continue;const f=FK[a.k];if(!f.pack||a.agr>0)continue;
    for(const b of fauna){if(b===a||b.dead||b.k!==a.k||b.agr<=0)continue;
      if(hyp(b.x-a.x,b.z-a.z)<f.packR){a.agr=Math.max(a.agr,4);break;}}}

  for(const n of npcs){const dp=hyp(P.x-n.x,P.z-n.z);n.t-=dt;let sp=0;if(dp<5)n.a=Math.atan2(P.x-n.x,P.z-n.z);else{if(n.t<=0){n.t=2+R()*4;const far=hyp(n.x-n.hx,n.z-n.hz)>(night&&n.role!=='wache'?4:12);n.a=far?Math.atan2(n.hx-n.x,n.hz-n.z):R()*6.3;n.go=far||R()<.5}sp=n.go&&n.role!=='wache'?1.3:0}
const ox=n.x,oz=n.z;if(sp){step(n,Math.sin(n.a)*sp*dt,Math.cos(n.a)*sp*dt,.45,0);if(n.x===ox&&n.z===oz){n.a+=2;n.t=0}}n.y=gY(n.x,n.z);n.ph+=dt*sp*7;const s=Math.sin(n.ph)*.8,u=n.m.u;u.l[0].rotation.x=s;u.l[1].rotation.x=-s;u.a[0].rotation.x=-s*.7;u.a[1].rotation.x=s*.7;n.m.position.set(n.x,n.y,n.z);n.m.rotation.y+=Math.atan2(Math.sin(n.a-n.m.rotation.y),Math.cos(n.a-n.m.rotation.y))*Math.min(1,dt*8)}
if(fish.s){if(eq!=='angel'||hyp(fish.x-P.x,fish.z-P.z)>9)fReset();else{fish.t-=dt;bob.position.set(fish.x,.05+Math.sin(now*3)*.04-(fish.s===2?.15:0),fish.z);if(fish.s===1&&fish.t<=0){fish.s=2;fish.t=1.3;say('🐟 Es beißt! Jetzt ziehen!')}else if(fish.s===2&&fish.t<=0){say('Der Fisch ist entkommen.');fReset()}}}
for(const o of objs){if(!o.alive&&now>o.rt){o.alive=1;o.hp=OT[o.t].hp;if(o.c)o.c.dead=0;setM(o,1)}if(o.sh>0){o.sh-=dt;if(o.sh<=0)setM(o,1)}}
P.hu=Math.max(0,P.hu-.16*DIFM[CFG.dif]*dt);P.th=Math.max(0,P.th-.21*DIFM[CFG.dif]*dt);if(P.hu<=0||P.th<=0)P.hp-=1.2*dt;else if(P.hu>50&&P.th>50&&P.hp<100)P.hp=Math.min(100,P.hp+.6*dt);
if(P.hp<=0){P.hp=100;P.hu=P.th=60;[P.x,P.z]=SP;P.y=gY(P.x,P.z);say('Du bist gestorben und erwachst am Startpunkt.')}}
const cp=new T.Vector3();
function render(dt){const e=Math.sin(2*Math.PI*(tod-.25)),d=clamp(e*2+.35),sky=new T.Color(0x0b1230).lerp(new T.Color(0x9cc4e8),d).lerp(new T.Color(0xf0905a),clamp(1-Math.abs(e)*4)*.4);sc.background=sky;sc.fog.color.copy(sky);hemi.intensity=.3+.6*d;sun.intensity=.1+.85*d;const a=2*Math.PI*(tod-.25);sun.position.set(P.x+Math.cos(a)*60,25+Math.max(e,.1)*60,P.z+30);sun.target.position.set(P.x,P.y,P.z);for(const c of clouds){c.position.x+=dt*2;if(c.position.x>300)c.position.x=-300}
let nf=null,nd=30;for(const b of blds)if(DF[b.k].fire||DF[b.k].lit){const q=hyp(b.x-P.x,b.z-P.z);if(q<nd){nd=q;nf=b}}if(nf){fireL.position.set(nf.x,gY(nf.x,nf.z)+1.2,nf.z);fireL.intensity=(1.4-d*.8)*(.85+.15*Math.sin(now*12))}else fireL.intensity=0;
const inside=floors.some(f=>Math.abs(P.x-f.x)<f.hx&&Math.abs(P.z-f.z)<f.hz&&f.hx>2);zoom+=((inside?3.2:gk?uz*.78:uz)-zoom)*Math.min(1,dt*6);const ch=Math.cos(pitch),sh=Math.sin(pitch),ty=P.y+1.7;
if(mode!=='intro')cp.set(P.x+Math.sin(cy)*ch*zoom,Math.max(ty+sh*zoom,gY(P.x+Math.sin(cy)*ch*zoom,P.z+Math.cos(cy)*ch*zoom)+.7),P.z+Math.cos(cy)*ch*zoom);if(mode!=='intro'){cam.position.lerp(cp,1-Math.exp(-dt*16));cam.lookAt(P.x,ty+.3,P.z)}
const p=wg.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,Math.sin(p.getX(i)*.09+now*1.4)*.1+Math.cos(p.getZ(i)*.11+now*1.1)*.1);p.needsUpdate=true;
if(cam.position.y<.05){sc.fog.color.setHex(0x1f6a96);sc.fog.near=1;sc.fog.far=45;sc.background=sc.fog.color}else{sc.fog.near=FD[CFG.vd][0];sc.fog.far=FD[CFG.vd][1]}
if(ghost){const[x,z]=gPos(),ok=valid(gk,x,z,gr);let gx=x,gz=z;if(gk==='del'){let bd=4;for(const q of blds){const d2=hyp(q.x-x,q.z-z);if(d2<bd){bd=d2;gx=q.x;gz=q.z}}}ghost.position.set(gx,by(gk,x,z,gr)+(gk==='del'?.1:0),gz);ghost.rotation.y=gr*Math.PI/2;gMat.color.set(ok?0x88ff88:0xff6666)}
tagUp();ren.render(sc,cam)}
let hudT=0,last=performance.now();
function hud(){const b=[P.hp,P.hu,P.th,P.st];b.forEach((v,i)=>$('b'+i).style.width=v+'%');let v=VIL.find(([n,[x,z]])=>hyp(x-P.x,z-P.z)<30);const q=!inv.axt?'Aufgabe: Sammle Steine, Fasern, Holz (✋/⚔️) und stelle eine Steinaxt her.':!blds.some(b=>b.k==='fire')?'Aufgabe: Baue ein Lagerfeuer (🏠).':'Angle, jage, handle und baue dein Reich.';$('info').textContent=(v?'Im Dorf: '+v[0]+' · ':'')+(P.deep?'🏊 Schwimmen · ':'')+(P.hu<20?'Hunger! ':'')+(P.th<20?'Durst! ':'')+q}
function frame(){requestAnimationFrame(frame);const t=performance.now(),dt=Math.min(.05,(t-last)/1000);last=t;if(mode==='play'||mode==='build'){now+=dt;tod=(tod+dt/360)%1;updP(dt);updW(dt,Math.sin(2*Math.PI*(tod-.25))<-.1);sepAll();updFx(dt);hudT-=dt;if(hudT<=0){hudT=.15;hud()}}if(mode==='menu')menuTick(dt);else if(mode==='intro')introTick(dt);render(dt)}

function boot(){

for(let i=0;i<14;i++){const a=i*.5,d=6+rnd()*14;const x=P.x+Math.cos(a)*d,z=P.z+Math.sin(a)*d;if(H(x,z)>.9)addO(['pebble','tuft','bush','pebble','tuft'][i%5],x,z)}

}
